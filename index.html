<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      window.addEventListener(
        'error',
        function (event) {
          var src = event && event.filename ? String(event.filename) : '';
          var stack = event && event.error && event.error.stack ? String(event.error.stack) : '';
          if (
            src.indexOf('chrome-extension://') === 0 ||
            src.indexOf('moz-extension://') === 0 ||
            stack.indexOf('chrome-extension://') !== -1
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        },
        true
      );
    </script>
    <title>Universal Invoice Generator — Create. Customize. Invoice.</title>
    <meta
      name="description"
      content="Create, customize, and export professional invoices with real-time preview, tailored templates, and a digital signature and company seal studio."
    />
    <meta property="og:title" content="Universal Invoice Generator" />
    <meta
      property="og:description"
      content="Create. Customize. Invoice. Professional billing workspace for freelancers, agencies, and businesses."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-blue-100 selection:text-blue-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
